apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab01
  annotations:
   # service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
  - port: 80            # 서비스 port
    targetPort: 80      # container  port
                        # port-forward  8080:80   -> 8080: nodeport(cp),  80: 서비스
                        # terminal에 나오는거     8080 -> 80    nodeport(cp) -> pod