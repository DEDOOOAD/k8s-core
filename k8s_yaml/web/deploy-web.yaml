apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: project
spec:
  replicas: 2
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector: 
    matchLabels:
      tier: web
      
  template: 
    metadata:
      labels: 
        tier: web
    spec: 
      containers:
      - name: web
        image: songyibkb/web:1.0
        ports:
        - containerPort: 80
                      
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3