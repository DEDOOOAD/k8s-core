apiVersion: apps/v1
kind: Deployment
metadata:
  name: was
  namespace: project
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector: 
    matchLabels:
      tier: was

  template: 
    metadata:
      labels: 
        tier: was
    spec: 
      containers:
      - name: was
        image: songyibkb/was:1.0
        ports:
        - containerPort: 8080

        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://db.project.svc.cluster.local/vet"
        - name: SPRING_DATASOURCE_USERNAME
          value: "vet_user"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "password"

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3